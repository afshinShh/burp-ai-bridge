<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ee8b46"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/>
    </marker>
  </defs>

  <!-- title -->
  <text x="460" y="40" text-anchor="middle" fill="#e6edf3" font-size="19" font-weight="600">
    From Burp Suite to any AI agent on your machine
  </text>

  <!-- trigger pill -->
  <rect x="280" y="60" width="360" height="26" rx="13" fill="#1a2332" stroke="#29405e"/>
  <text x="460" y="77" text-anchor="middle" fill="#79c0ff" font-size="11.5">
    you say: “check the burp inbox” in your agent chat
  </text>

  <!-- ================= LEFT: Burp ================= -->
  <rect x="24" y="104" width="252" height="240" rx="12" fill="#161b22" stroke="#30363d"/>
  <circle cx="44" cy="128" r="6" fill="#ee8b46"/>
  <text x="58" y="133" fill="#e6edf3" font-size="14" font-weight="600">Burp Suite (you)</text>
  <text x="46" y="152" fill="#8b949e" font-size="11">Proxy history · Repeater · viewers</text>

  <rect x="44" y="166" width="200" height="146" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="56" y="185" fill="#79c0ff" font-size="11" font-weight="600">AI Bridge</text>
  <rect x="56" y="196" width="176" height="10" rx="2" fill="#21262d"/>
  <rect x="56" y="212" width="176" height="10" rx="2" fill="#1a2332" stroke="#29405e" stroke-width="0.6"/>
  <rect x="56" y="228" width="176" height="10" rx="2" fill="#21262d"/>
  <rect x="56" y="244" width="176" height="10" rx="2" fill="#21262d"/>
  <rect x="56" y="270" width="176" height="22" rx="4" fill="#b95318"/>
  <text x="144" y="285" text-anchor="middle" fill="#ffffff" font-size="10.5" font-weight="600">Send selected</text>
  <text x="144" y="306" text-anchor="middle" fill="#8b949e" font-size="9.5">right-click menu everywhere too</text>

  <!-- arrow 1 -->
  <line x1="282" y1="224" x2="410" y2="224" stroke="#ee8b46" stroke-width="2" marker-end="url(#arrOrange)"/>

  <!-- ================= CENTER: file inbox ================= -->
  <rect x="420" y="104" width="208" height="240" rx="12" fill="#101828" stroke="#29405e"/>
  <rect x="448" y="126" width="152" height="26" rx="6" fill="#1f6feb"/>
  <text x="524" y="143" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600" font-family="'SFMono-Regular',Menlo,Consolas,monospace">~/.ai-inbox/burp/</text>

  <text x="452" y="180" fill="#c9d1d9" font-size="10.5" font-family="'SFMono-Regular',Menlo,Consolas,monospace">manifest.jsonl</text>
  <text x="452" y="200" fill="#c9d1d9" font-size="10.5" font-family="'SFMono-Regular',Menlo,Consolas,monospace">*.request.http</text>
  <text x="452" y="220" fill="#c9d1d9" font-size="10.5" font-family="'SFMono-Regular',Menlo,Consolas,monospace">*.response.http</text>
  <text x="452" y="240" fill="#8b949e" font-size="10.5" font-family="'SFMono-Regular',Menlo,Consolas,monospace">archive/</text>

  <rect x="440" y="282" width="168" height="24" rx="12" fill="#238636"/>
  <text x="524" y="298" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">pending unread: 12</text>

  <!-- arrow 2 -->
  <line x1="632" y1="224" x2="660" y2="224" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ================= RIGHT: agents ================= -->
  <rect x="672" y="104" width="224" height="240" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="784" y="128" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="600">AI agents</text>

  <rect x="700" y="142" width="168" height="44" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="784" y="161" text-anchor="middle" fill="#c9d1d9" font-size="11" font-weight="600">OpenCode session</text>
  <text x="784" y="177" text-anchor="middle" fill="#8b949e" font-size="9.5">hunting IDOR, will report</text>

  <rect x="700" y="196" width="168" height="44" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="784" y="215" text-anchor="middle" fill="#c9d1d9" font-size="11" font-weight="600">Claude Code</text>
  <text x="784" y="231" text-anchor="middle" fill="#8b949e" font-size="9.5">reviewing the auth batch</text>

  <rect x="700" y="250" width="168" height="44" rx="8" fill="#0d1117" stroke="#30363d" stroke-dasharray="5 4"/>
  <text x="784" y="269" text-anchor="middle" fill="#c9d1d9" font-size="11" font-weight="600">any model / script</text>
  <text x="784" y="285" text-anchor="middle" fill="#8b949e" font-size="9.5">anything that reads files</text>

  <text x="784" y="314" text-anchor="middle" fill="#8b949e" font-size="10">read -&gt; act -&gt; archive</text>

  <!-- feedback loop -->
  <path d="M 784 348 L 784 400 L 150 400 L 150 352" fill="none" stroke="#3fb950" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrGreen)"/>
  <text x="467" y="416" text-anchor="middle" fill="#3fb950" font-size="10.5">
    findings go to your chat · consumed items moved into archive/
  </text>

  <!-- bottom strip -->
  <rect x="24" y="440" width="872" height="40" rx="10" fill="#21262d"/>
  <text x="460" y="464" text-anchor="middle" fill="#adbac7" font-size="12">
    No daemon · no network · nothing leaves the machine — every session, every model, one folder.
  </text>
</svg>
