<svg xmlns="http://www.w3.org/2000/svg" width="940" height="404" viewBox="0 0 940 404" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <!-- window -->
  <rect x="0" y="0" width="940" height="404" rx="12" fill="#0d1117" stroke="#30363d"/>
  <rect x="0" y="0" width="940" height="36" rx="12" fill="#161b22"/>
  <circle cx="22" cy="18" r="5" fill="#f85149"/>
  <circle cx="40" cy="18" r="5" fill="#e3b341"/>
  <circle cx="58" cy="18" r="5" fill="#3fb950"/>
  <text x="470" y="23" text-anchor="middle" fill="#8b949e" font-size="12">Burp Suite Professional — AI Bridge</text>

  <!-- toolbar row 1 -->
  <rect x="8" y="44" width="924" height="32" rx="6" fill="#161b22" stroke="#21262d"/>
  <g font-size="11" fill="#c9d1d9">
    <rect x="16" y="49" width="98" height="22" rx="4" fill="#21262d" stroke="#30363d"/>
    <text x="65" y="63.5" text-anchor="middle">Refresh history</text>
    <rect x="120" y="49" width="88" height="22" rx="4" fill="#21262d" stroke="#30363d"/>
    <text x="164" y="63.5" text-anchor="middle">Send selected</text>
    <text x="222" y="63.5" fill="#8b949e">Filter:</text>
    <rect x="258" y="49" width="130" height="22" rx="4" fill="#0d1117" stroke="#30363d"/>
    <text x="266" y="63.5" fill="#e6edf3">admin</text>
    <text x="402" y="63.5" fill="#8b949e">Max rows:</text>
    <rect x="458" y="49" width="48" height="22" rx="4" fill="#0d1117" stroke="#30363d"/>
    <text x="466" y="63.5" fill="#e6edf3">3000</text>
    <rect x="516" y="51" width="12" height="12" rx="2" fill="#0d1117" stroke="#8b949e"/>
    <text x="533" y="63.5">Include response</text>
    <rect x="522" y="53.5" width="7" height="7" fill="none" stroke="#3fb950" stroke-width="1.6"/>
    <rect x="632" y="51" width="12" height="12" rx="2" fill="#0d1117" stroke="#8b949e"/>
    <text x="649" y="63.5">Hide sent</text>
  </g>

  <!-- toolbar row 2 -->
  <rect x="8" y="80" width="924" height="32" rx="6" fill="#161b22" stroke="#21262d"/>
  <g font-size="11" fill="#c9d1d9">
    <rect x="16" y="85" width="12" height="12" rx="2" fill="#0d1117" stroke="#8b949e"/>
    <text x="33" y="97.5">In scope only</text>
    <rect x="112" y="85" width="74" height="22" rx="4" fill="#21262d" stroke="#30363d"/>
    <text x="149" y="99.5" text-anchor="middle">Forget sent</text>
    <text x="202" y="97.5" fill="#8b949e">Note:</text>
    <rect x="238" y="85" width="200" height="22" rx="4" fill="#0d1117" stroke="#30363d"/>
    <text x="246" y="99.5" fill="#e6edf3">auth looks client-side only</text>
    <rect x="680" y="85" width="76" height="22" rx="4" fill="#21262d" stroke="#30363d"/>
    <text x="718" y="99.5" text-anchor="middle">Open inbox</text>
    <rect x="762" y="85" width="146" height="22" rx="4" fill="#21262d" stroke="#30363d"/>
    <text x="835" y="99.5" text-anchor="middle">Mark all read (archive)</text>
  </g>

  <!-- table header -->
  <rect x="12" y="120" width="916" height="24" fill="#161b22" stroke="#30363d"/>
  <g font-size="10.5" fill="#c9d1d9">
    <text x="18" y="136">ID</text>
    <text x="58" y="136">Time</text>
    <text x="136" y="136">Method</text>
    <text x="196" y="136">Host</text>
    <text x="346" y="136">Path</text>
    <text x="586" y="136">Status</text>
    <text x="636" y="136">Len</text>
    <text x="684" y="136">Note</text>
    <text x="834" y="136">Agent</text>
  </g>
  <line x1="828" y1="120" x2="828" y2="144" stroke="#30363d"/>
  <line x1="12" y1="144" x2="928" y2="144" stroke="#30363d"/>

  <!-- rows -->
  <g font-family="ui-monospace,'JetBrains Mono',Menlo,monospace" font-size="10.5">
    <!-- batch 1 (replied) -->
    <rect x="12" y="144" width="916" height="26" fill="#463B15"/>
    <g fill="#f0f6fa">
      <text x="18" y="161">9182</text>
      <text x="58" y="161">12:04</text>
      <text x="136" y="161">GET</text>
      <text x="196" y="161">api.example.com</text>
      <text x="346" y="161">/api/v1/me/orders</text>
      <text x="586" y="161">200</text>
      <text x="636" y="161">1243</text>
      <text x="684" y="161">auth looks off</text>
      <text x="834" y="161">✓ 3 IDOR hits</text>
    </g>
    <rect x="12" y="170" width="916" height="26" fill="#463B15"/>
    <g fill="#f0f6fa">
      <text x="18" y="187">9183</text>
      <text x="58" y="187">12:04</text>
      <text x="136" y="187">POST</text>
      <text x="196" y="187">api.example.com</text>
      <text x="346" y="187">/api/v2/checkout</text>
      <text x="586" y="187">200</text>
      <text x="636" y="187">812</text>
      <text x="684" y="187"></text>
      <text x="834" y="187">✓ 3 IDOR hits</text>
    </g>
    <!-- batch 2 (consumed, no reply yet) -->
    <rect x="12" y="196" width="916" height="26" fill="#14424F"/>
    <g fill="#f0f6fa">
      <text x="18" y="213">9187</text>
      <text x="58" y="213">12:11</text>
      <text x="136" y="213">GET</text>
      <text x="196" y="213">api.example.com</text>
      <text x="346" y="213">/api/v1/admin/users</text>
      <text x="586" y="213">403</text>
      <text x="636" y="213">96</text>
      <text x="684" y="213">scope check</text>
      <text x="834" y="213">✓</text>
    </g>
    <!-- batch 3 (sent, pending) -->
    <rect x="12" y="222" width="916" height="26" fill="#16401F"/>
    <g fill="#f0f6fa">
      <text x="18" y="239">9190</text>
      <text x="58" y="239">12:15</text>
      <text x="136" y="239">GET</text>
      <text x="196" y="239">api.example.com</text>
      <text x="346" y="239">/api/v1/me/orders/1337</text>
      <text x="586" y="239">200</text>
      <text x="636" y="239">1180</text>
      <text x="684" y="239"></text>
      <text x="834" y="239">sent</text>
    </g>
    <!-- untagged rows -->
    <g fill="#c9d1d9">
      <text x="18" y="265">9194</text>
      <text x="58" y="265">12:19</text>
      <text x="136" y="265">PUT</text>
      <text x="196" y="265">api.example.com</text>
      <text x="346" y="265">/api/v1/me/email</text>
      <text x="586" y="265">204</text>
      <text x="636" y="265">0</text>
      <text x="18" y="291">9199</text>
      <text x="58" y="291">12:26</text>
      <text x="136" y="291">GET</text>
      <text x="196" y="291">cdn.example.com</text>
      <text x="346" y="291">/assets/app.js</text>
      <text x="586" y="291">200</text>
      <text x="636" y="291">58344</text>
      <text x="18" y="317">9203</text>
      <text x="58" y="317">12:31</text>
      <text x="136" y="317">POST</text>
      <text x="196" y="317">api.example.com</text>
      <text x="346" y="317">/api/v1/login</text>
      <text x="586" y="317">302</text>
      <text x="636" y="317">0</text>
    </g>
  </g>

  <!-- footer: inbox dir -->
  <rect x="8" y="334" width="924" height="30" rx="6" fill="#161b22" stroke="#21262d"/>
  <text x="16" y="353" font-size="11" fill="#8b949e">Inbox dir:</text>
  <rect x="76" y="338" width="660" height="22" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="84" y="353" font-size="10.5" fill="#e6edf3" font-family="ui-monospace,Menlo,monospace">/home/you/.ai-inbox/burp</text>
  <rect x="744" y="338" width="40" height="22" rx="4" fill="#21262d" stroke="#30363d"/>
  <text x="764" y="353" font-size="11" fill="#c9d1d9" text-anchor="middle">Set</text>

  <!-- status row -->
  <text x="16" y="386" font-size="11" fill="#8b949e">Select rows and click Send.</text>
  <text x="924" y="386" font-size="11" fill="#8b949e" text-anchor="end">Pending unread: 0</text>
</svg>
